<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Landow Intercom — Admin console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="/shared/img/lion-mark.png" alt="Landow Jewish Academy" class="brand-mark" />
    <div class="brand-text">
      <div class="brand-word">Landow Intercom</div>
      <div class="brand-sub">Admin console</div>
    </div>
  </div>
  <span id="clock" style="font-size:13px;color:#cfcfe6;"></span>
</header>
<div class="gold-bar"></div>

<main>
  <div id="incoming-banner" class="incoming-banner" style="display:none;">
    <div>
      <strong id="incoming-text">Incoming reply</strong>
      <div class="sub" style="color:#6b7078;">Someone wants to speak privately</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn answer" onclick="answerReply()">Answer</button>
      <button class="btn decline" onclick="declineReplyBtn()">Decline</button>
    </div>
  </div>

  <button class="all-call-btn" onclick="callAllSchool()">Page whole school</button>

  <div id="floors"></div>
</main>

<div id="call-bar" class="call-bar" style="display:none;">
  <div>
    <div class="label" id="call-bar-label">—</div>
    <div class="sub" id="call-bar-sub">—</div>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn reply" id="admin-mute-btn" onclick="toggleAdminMute()">Mute</button>
    <button class="btn end" onclick="endCurrentCall()">End</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="/shared/config.js"></script>
<script src="/shared/intercom.js"></script>
<script>
const FLOOR_LABELS = { 1: "Floor 1 — K-1st", 2: "Floor 2 — 2nd-5th", 3: "Floor 3 — Middle school", 4: "Floor 4 — High school" };

let currentCall = null;      // { type, target, livekitRoomName, room, callLogId, channel }
let pendingReply = null;     // payload of the reply currently shown in the incoming banner
let adminInboxChannel = null;
let presenceState = {};      // room_number -> true if online
let adminMuted = false;

document.getElementById("clock").textContent = new Date().toLocaleString();

async function init() {
  const { data: rooms, error } = await supabaseClient.from("rooms").select("*").order("floor").order("room_number");
  if (error) {
    document.getElementById("floors").textContent = "Failed to load rooms: " + error.message;
    return;
  }
  renderFloors(rooms);
  setupPresence();
  setupAdminInbox();
}

function renderFloors(rooms) {
  const byFloor = {};
  for (const r of rooms) (byFloor[r.floor] = byFloor[r.floor] || []).push(r);

  const container = document.getElementById("floors");
  container.innerHTML = "";
  for (const floor of Object.keys(byFloor).sort()) {
    const section = document.createElement("div");
    section.className = "floor-section";
    section.innerHTML = `
      <h2>${FLOOR_LABELS[floor] || "Floor " + floor}
        <button class="floor-call-btn" onclick="callFloor(${floor})">Page this floor</button>
      </h2>
      <div class="room-grid" id="grid-floor-${floor}"></div>
    `;
    container.appendChild(section);

    const grid = section.querySelector(`#grid-floor-${floor}`);
    for (const room of byFloor[floor]) {
      const btn = document.createElement("button");
      btn.className = "room-btn";
      btn.id = `room-btn-${room.room_number}`;
      btn.innerHTML = `${room.display_name}<span class="status-dot" id="dot-${room.room_number}"></span>`;
      btn.onclick = () => callRoom(room.room_number);
      grid.appendChild(btn);
    }
  }
}

function setupPresence() {
  const presenceChannel = supabaseClient.channel("presence:rooms");
  presenceChannel.on("presence", { event: "sync" }, () => {
    const state = presenceChannel.presenceState();
    presenceState = {};
    for (const key of Object.keys(state)) presenceState[key] = true;
    for (const key of Object.keys(presenceState)) {
      const dot = document.getElementById(`dot-${key}`);
      if (dot) dot.classList.add("online");
    }
  });
  presenceChannel.subscribe();
}

function setupAdminInbox() {
  adminInboxChannel = supabaseClient.channel("call:admin");
  adminInboxChannel.on("broadcast", { event: "ring" }, ({ payload }) => showIncomingBanner(payload));
  adminInboxChannel.subscribe();
}

function showIncomingBanner(payload) {
  if (currentCall) return; // v1: one call at a time — ignore new rings mid-call
  pendingReply = payload;
  document.getElementById("incoming-text").textContent = `Room ${payload.from} wants to reply`;
  document.getElementById("incoming-banner").style.display = "flex";
}

function hideIncomingBanner() {
  pendingReply = null;
  document.getElementById("incoming-banner").style.display = "none";
}

async function answerReply() {
  const payload = pendingReply;
  hideIncomingBanner();
  await adminInboxChannel.send({ type: "broadcast", event: "answered", payload });
  const room = await connectToLiveKitRoom("admin", payload.livekit_room, { canPublish: true, canSubscribe: true });
  currentCall = { type: "individual", target: payload.from, livekitRoomName: payload.livekit_room, room, callLogId: null, channel: adminInboxChannel };
  showCallBar(`Live — Room ${payload.from}`, "Two-way reply call");
}

function declineReplyBtn() {
  const payload = pendingReply;
  hideIncomingBanner();
  adminInboxChannel.send({ type: "broadcast", event: "declined", payload });
}

async function callRoom(roomNumber) {
  if (currentCall) return alert("End the current call first.");
  const livekitRoomName = `individual-${roomNumber}-${Date.now()}`;
  const channel = supabaseClient.channel(`call:room:${roomNumber}`);
  try {
    const callLogId = await logCallStart("individual", roomNumber, "admin", livekitRoomName);
    channel.on("broadcast", { event: "answered" }, () => updateCallBar(`Live — Room ${roomNumber}`, "Two-way call in progress"));
    channel.on("broadcast", { event: "declined" }, () => { alert(`Room ${roomNumber} declined the call.`); endCurrentCall(true); });
    channel.on("broadcast", { event: "hangup" }, () => endCurrentCall(true));
    await channel.subscribe();
    await channel.send({ type: "broadcast", event: "ring", payload: { livekit_room: livekitRoomName, from: "admin" } });

    const room = await connectToLiveKitRoom("admin", livekitRoomName, { canPublish: true, canSubscribe: true });
    currentCall = { type: "individual", target: roomNumber, livekitRoomName, room, callLogId, channel };
    showCallBar(`Calling room ${roomNumber}…`, "Connecting — audio opens automatically");
  } catch (err) {
    alert(`Couldn't start the call to room ${roomNumber}: ${err.message}`);
    channel.unsubscribe();
  }
}

async function callFloor(floor) {
  if (currentCall) return alert("End the current call first.");
  const livekitRoomName = `floor-${floor}-${Date.now()}`;
  const channel = supabaseClient.channel(`call:floor:${floor}`);
  try {
    const callLogId = await logCallStart("floor", floor, "admin", livekitRoomName);
    await channel.subscribe();
    await channel.send({ type: "broadcast", event: "broadcast_start", payload: { livekit_room: livekitRoomName } });
    const room = await connectToLiveKitRoom("admin", livekitRoomName, { canPublish: true, canSubscribe: false });
    currentCall = { type: "floor", target: floor, livekitRoomName, room, callLogId, channel };
    showCallBar(`Paging floor ${floor}`, "One-way — everyone on this floor can hear you");
  } catch (err) {
    alert(`Couldn't start the floor page: ${err.message}`);
    channel.unsubscribe();
  }
}

async function callAllSchool() {
  if (currentCall) return alert("End the current call first.");
  const livekitRoomName = `all-school-${Date.now()}`;
  const channel = supabaseClient.channel("call:all");
  try {
    const callLogId = await logCallStart("all_school", "all", "admin", livekitRoomName);
    await channel.subscribe();
    await channel.send({ type: "broadcast", event: "broadcast_start", payload: { livekit_room: livekitRoomName } });
    const room = await connectToLiveKitRoom("admin", livekitRoomName, { canPublish: true, canSubscribe: false });
    currentCall = { type: "all_school", target: "all", livekitRoomName, room, callLogId, channel };
    showCallBar("Paging whole school", "One-way — every room can hear you");
  } catch (err) {
    alert(`Couldn't start the school-wide page: ${err.message}`);
    channel.unsubscribe();
  }
}

async function endCurrentCall(remoteInitiated) {
  if (!currentCall) return;
  const { livekitRoomName, room, callLogId, channel, type } = currentCall;
  if (!remoteInitiated) {
    const event = type === "individual" ? "hangup" : "broadcast_end";
    await channel.send({ type: "broadcast", event, payload: { livekit_room: livekitRoomName } });
  }
  await disconnectLiveKitRoom(room);
  await logCallEnd(callLogId);
  if (channel !== adminInboxChannel) await channel.unsubscribe();
  currentCall = null;
  hideCallBar();
}

async function toggleAdminMute() {
  if (!currentCall) return;
  adminMuted = !adminMuted;
  await currentCall.room.localParticipant.setMicrophoneEnabled(!adminMuted);
  document.getElementById("admin-mute-btn").textContent = adminMuted ? "Unmute" : "Mute";
}

function showCallBar(label, sub) {
  adminMuted = false;
  document.getElementById("admin-mute-btn").textContent = "Mute";
  document.getElementById("call-bar-label").textContent = label;
  document.getElementById("call-bar-sub").textContent = sub;
  document.getElementById("call-bar").style.display = "flex";
}
function updateCallBar(label, sub) {
  document.getElementById("call-bar-label").textContent = label;
  document.getElementById("call-bar-sub").textContent = sub;
}
function hideCallBar() { document.getElementById("call-bar").style.display = "none"; }

init();
</script>
</body>
</html>

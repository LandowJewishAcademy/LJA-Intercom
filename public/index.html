<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Landow Intercom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="/shared/img/lion-mark.png" alt="Landow Jewish Academy" class="brand-mark" />
    <div class="brand-text">
      <div class="brand-word">Landow Intercom</div>
    </div>
  </div>
</header>
<div class="gold-bar"></div>
<main style="text-align:center; padding-top:60px;">
  <p style="color:var(--text-muted); margin-bottom:24px; font-size:16px;">
    This site has two parts: the admin console (used from the office) and one
    receiver page per classroom (loaded on each classroom tablet).
  </p>
  <p><a href="/admin/" style="color:var(--navy); font-weight:600;">Open admin console &rarr;</a></p>
  <p style="color:var(--text-muted); font-size:14px;">
    Each classroom tablet should load <code>/room/&lt;room-number&gt;</code>,
    e.g. <code>/room/204</code>.
  </p>
</main>
</body>
</html>

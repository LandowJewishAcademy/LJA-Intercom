<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Landow Intercom — Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css" />
</head>
<body>

<div id="unlock-screen" class="room-screen">
  <img src="/shared/img/lion-mark.png" alt="Landow Jewish Academy" class="idle-lion" />
  <div class="state-title">Tap to activate</div>
  <div class="state-sub">One-time tap so this tablet can play calls and announcements automatically</div>
  <div class="room-actions"><button class="big-btn answer" onclick="unlockAndInit()">Tap to start</button></div>
</div>

<div id="screen" class="room-screen" style="display:none;">
  <div class="brand-corner">
    <img src="/shared/img/lion-mark.png" alt="" />
    <span>Landow Intercom</span>
  </div>
  <div class="idle-signage">
    <img src="/shared/img/lion-mark.png" alt="Landow Jewish Academy" class="idle-lion" />
    <div class="idle-wordmark">Landow <span class="accent">Intercom</span></div>
  </div>
  <div class="room-label" id="room-label">Loading…</div>
  <div class="state-title" id="state-title">—</div>
  <div class="state-sub" id="state-sub">—</div>
  <div class="room-actions" id="actions"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="/shared/config.js"></script>
<script src="/shared/intercom.js"></script>
<script>
const params = new URLSearchParams(location.search);
const roomNumber = params.get("room") || location.pathname.split("/").filter(Boolean).pop();

let roomInfo = null;
let activeLiveKitRoom = null;
let activeChannel = null;
let currentLivekitRoomName = null;
let pendingLivekitRoomName = null; // used while waiting for admin to answer a reply

async function init() {
  const { data, error } = await supabaseClient.from("rooms").select("*").eq("room_number", roomNumber).single();
  if (error || !data) {
    setState("idle", "Room not found", `No room "${roomNumber}" in the directory. Check the URL.`);
    return;
  }
  roomInfo = data;
  document.getElementById("room-label").textContent = roomInfo.display_name;

  const presenceChannel = supabaseClient.channel("presence:rooms", { config: { presence: { key: roomNumber } } });
  presenceChannel.subscribe(async (status) => {
    if (status === "SUBSCRIBED") await presenceChannel.track({ room_number: roomNumber, floor: roomInfo.floor });
  });

  const roomChannel = supabaseClient.channel(`call:room:${roomNumber}`);
  roomChannel.on("broadcast", { event: "ring" }, ({ payload }) => handleIncomingRing(roomChannel, payload));
  roomChannel.on("broadcast", { event: "hangup" }, () => handleRemoteHangup());
  await roomChannel.subscribe();

  const floorChannel = supabaseClient.channel(`call:floor:${roomInfo.floor}`);
  floorChannel.on("broadcast", { event: "broadcast_start" }, ({ payload }) => handleBroadcastStart(payload, `Floor ${roomInfo.floor} announcement`));
  floorChannel.on("broadcast", { event: "broadcast_end" }, () => handleBroadcastEnd());
  await floorChannel.subscribe();

  const allChannel = supabaseClient.channel("call:all");
  allChannel.on("broadcast", { event: "broadcast_start" }, ({ payload }) => handleBroadcastStart(payload, "Whole-school announcement"));
  allChannel.on("broadcast", { event: "broadcast_end" }, () => handleBroadcastEnd());
  await allChannel.subscribe();

  setState("idle", "Ready", "Waiting for a call or announcement");
}

async function handleIncomingRing(roomChannel, payload) {
  activeChannel = roomChannel;
  currentLivekitRoomName = payload.livekit_room;
  try {
    activeLiveKitRoom = await connectToLiveKitRoom(`room-${roomNumber}`, currentLivekitRoomName, { canPublish: true, canSubscribe: true });
    await roomChannel.send({ type: "broadcast", event: "answered", payload: { livekit_room: currentLivekitRoomName } });
    setState("live", "Call from the office", "Two-way audio — live now");
  } catch (err) {
    console.error("Couldn't connect incoming call:", err.message);
    resetToIdle();
  }
}

async function endCall() {
  await activeChannel.send({ type: "broadcast", event: "hangup", payload: { livekit_room: currentLivekitRoomName } });
  await disconnectLiveKitRoom(activeLiveKitRoom);
  resetToIdle();
}

async function handleRemoteHangup() {
  await disconnectLiveKitRoom(activeLiveKitRoom);
  resetToIdle();
}

async function handleBroadcastStart(payload, label) {
  currentLivekitRoomName = payload.livekit_room;
  try {
    activeLiveKitRoom = await connectToLiveKitRoom(`room-${roomNumber}`, currentLivekitRoomName, { canPublish: false, canSubscribe: true });
    setState("broadcast", label, "Listening — tap Reply to speak with the office privately");
  } catch (err) {
    console.error("Couldn't join broadcast:", err.message);
    resetToIdle();
  }
}

async function handleBroadcastEnd() {
  await disconnectLiveKitRoom(activeLiveKitRoom);
  resetToIdle();
}

async function replyPrivately() {
  const livekitRoomName = `reply-${roomNumber}-${Date.now()}`;
  pendingLivekitRoomName = livekitRoomName;
  const adminChannel = supabaseClient.channel("call:admin");
  adminChannel.on("broadcast", { event: "answered" }, async ({ payload }) => {
    if (payload.livekit_room !== livekitRoomName) return;
    try {
      activeLiveKitRoom = await connectToLiveKitRoom(`room-${roomNumber}`, livekitRoomName, { canPublish: true, canSubscribe: true });
      activeChannel = adminChannel;
      currentLivekitRoomName = livekitRoomName;
      setState("live", "On call", "Two-way reply call with the office");
    } catch (err) {
      alert(`Couldn't connect the reply call: ${err.message}`);
      resetToIdle();
    }
  });
  adminChannel.on("broadcast", { event: "declined" }, ({ payload }) => {
    if (payload.livekit_room !== livekitRoomName) return;
    resetToIdle();
  });
  try {
    await adminChannel.subscribe();
    await adminChannel.send({ type: "broadcast", event: "ring", payload: { livekit_room: livekitRoomName, from: roomNumber } });
    setState("calling", "Calling the office…", "Waiting for someone to answer");
  } catch (err) {
    alert(`Couldn't reach the office: ${err.message}`);
    resetToIdle();
  }
}

function cancelReply() {
  resetToIdle();
}

function resetToIdle() {
  activeLiveKitRoom = null;
  currentLivekitRoomName = null;
  pendingLivekitRoomName = null;
  setState("idle", "Ready", "Waiting for a call or announcement");
}

function setState(state, title, sub) {
  const screen = document.getElementById("screen");
  screen.className = "room-screen state-" + state;
  document.getElementById("state-title").textContent = title;
  document.getElementById("state-sub").textContent = sub;

  const actions = document.getElementById("actions");
  actions.innerHTML = "";
  if (state === "live") {
    actions.innerHTML = `<button class="big-btn end" onclick="endCall()">End call</button>`;
  } else if (state === "broadcast") {
    actions.innerHTML = `<button class="big-btn reply" onclick="replyPrivately()">Reply privately</button>`;
  } else if (state === "calling") {
    actions.innerHTML = `<button class="big-btn decline" onclick="cancelReply()">Cancel</button>`;
  }
}

function unlockAndInit() {
  document.getElementById("unlock-screen").style.display = "none";
  document.getElementById("screen").style.display = "flex";
  init();
}
</script>
</body>
</html>
